 LOADING_TIP_6: "Merisodankäynti keksittiin samanaikaisesti kaikkialla maailmassa vuonna 690."
 LOADING_TIP_7: "Sotahaarniskan ohella, Sempronien suvun tärkein artifakti on uskonnollinen Pyhä Keppi, jolla on jopa voitettu ihmisiä kaksintaisteluissa."
 LOADING_TIP_8: "Kuollessaan vuonna 431, Kultismin perustaja Cali Sempron tunnettiin maailman viisaimpana ja maailman neljänneksi vanhimpana miehenä."
